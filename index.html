<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculateur de Moyenne - Semestre 1</title>

    <style>
      :root {
        --bg-color: #f0f8ff;
        --surface-color: #ffffff;
        --text-primary: #111111;
        --text-secondary: #444444;
        --border-color: #cce0ff;
        --accent-color: #0066cc;
        --success-color: #009933;
        --error-color: #cc0000;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--surface-color);
        padding: 60px;
        border: 1px solid var(--border-color);
      }

      h1 {
        font-weight: 600;
        font-size: 24px;
        text-align: center;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
        color: var(--accent-color);
      }

      .subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 48px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .subject-card {
        padding: 24px 0;
        border-bottom: 1px solid var(--border-color);
      }
      
      .subject-card:last-of-type {
        border-bottom: none;
      }

      .subject-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 16px;
      }

      .subject-name {
        font-weight: 500;
        font-size: 16px;
      }

      .coef-badge {
        background-color: #e6f2ff;
        color: var(--accent-color);
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-family: var(--font-mono);
        font-weight: 600;
      }

      .inputs-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 20px;
        align-items: end;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .grade-input {
        width: 100%;
        padding: 8px 0;
        border: none;
        border-bottom: 1px solid var(--border-color);
        font-family: var(--font-mono);
        font-size: 16px;
        color: var(--text-primary);
        background: transparent;
        transition: border-color 0.2s;
        -moz-appearance: textfield;
      }

      .grade-input::-webkit-outer-spin-button,
      .grade-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .grade-input:focus {
        outline: none;
        border-bottom-color: var(--accent-color);
      }

      .subject-average {
        margin-top: 16px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--text-secondary);
        text-align: right;
      }

      .calculate-btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin-top: 48px;
        background-color: var(--accent-color);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .calculate-btn:hover {
        opacity: 0.9;
      }

      .result {
        margin-top: 40px;
        padding-top: 40px;
        border-top: 2px solid var(--text-primary);
        text-align: center;
        display: none;
      }

      .result.show {
        display: block;
      }

      .average-value {
        font-family: var(--font-mono);
        font-size: 56px;
        font-weight: 400;
        margin: 16px 0;
        letter-spacing: -2px;
      }

      .status {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 6px 12px;
        border-radius: 4px;
        display: inline-block;
        font-weight: 600;
      }

      .status.admis {
        color: var(--success-color);
        background: rgba(0, 153, 51, 0.1);
      }
      
      .status.Redouble {
        color: var(--error-color);
        background: rgba(204, 0, 0, 0.1);
      }

      .error-message {
        color: var(--error-color);
        font-size: 13px;
        text-align: center;
        margin-top: 24px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      @media (max-width: 600px) {
        .container {
            padding: 30px 20px;
        }
        .average-value {
            font-size: 40px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Calculateur de Moyenne</h1>
      <p class="subtitle">Semestre 1 - Science de l’Informatique</p>

      <div id="subjects-container"></div>

      <button class="calculate-btn" onclick="calculateAverage()">
        Calculer la Moyenne Générale
      </button>

      <div class="error-message" id="error-message">
        Veuillez remplir toutes les notes entre 0 et 20
      </div>

      <div class="result" id="result">
        <div>Moyenne Générale</div>
        <div class="average-value" id="average-value">0.00</div>
        <div class="status" id="status">Admis</div>
      </div>
    </div>

    <script>
      const matieres = [
        { libelle: "Système d'exploitation 1", coef: 1.5, regime: 2 },
        {
          libelle: "Systèmes logiques et architecture des ordinateurs",
          coef: 2,
          regime: 2,
        },
        { libelle: "Technologies multimédias", coef: 1.5, regime: 2 },
        { libelle: "Logique formelle", coef: 1.5, regime: 1 },
        {
          libelle: "Algorithmique et structures de données",
          coef: 2,
          regime: 1,
        },
        { libelle: "Atelier programmation 1", coef: 1.5, regime: 2 },
        { libelle: "Analyse 1", coef: 1.5, regime: 1 },
        { libelle: "Algèbre 1", coef: 1.5, regime: 1 },
        { libelle: "Techniques de communication 1", coef: 1, regime: 3 },
        { libelle: "Anglais 1", coef: 1, regime: 3 },
      ];

      function calculateSubjectAverage(ds, test, exam, oral, tp, regime) {
        if (regime === 1) return ds * 0.2 + test * 0.1 + exam * 0.7;
        if (regime === 2) return ds * 0.1 + tp * 0.2 + exam * 0.7;
        if (regime === 3) return exam * 0.8 + oral * 0.2;
        return NaN;
      }

      function initializeSubjects() {
        const container = document.getElementById("subjects-container");

        matieres.forEach((m, i) => {
          let inputs = "";

          if (m.regime === 1) {
            inputs = `
<div class="input-group"><label class="input-label">DS</label><input type="number" class="grade-input" id="ds-${i}" oninput="updateSubject(${i})"></div>
<div class="input-group"><label class="input-label">Test</label><input type="number" class="grade-input" id="test-${i}" oninput="updateSubject(${i})"></div>
<div class="input-group"><label class="input-label">Examen</label><input type="number" class="grade-input" id="exam-${i}" oninput="updateSubject(${i})"></div>`;
          }

          if (m.regime === 2) {
            inputs = `
<div class="input-group"><label class="input-label">DS</label><input type="number" class="grade-input" id="ds-${i}" oninput="updateSubject(${i})"></div>
<div class="input-group"><label class="input-label">TP</label><input type="number" class="grade-input" id="tp-${i}" oninput="updateSubject(${i})"></div>
<div class="input-group"><label class="input-label">Examen</label><input type="number" class="grade-input" id="exam-${i}" oninput="updateSubject(${i})"></div>`;
          }

          if (m.regime === 3) {
            inputs = `
<div class="input-group"><label class="input-label">Examen</label><input type="number" class="grade-input" id="exam-${i}" oninput="updateSubject(${i})"></div>
<div class="input-group"><label class="input-label">Oral</label><input type="number" class="grade-input" id="oral-${i}" oninput="updateSubject(${i})"></div>`;
          }

          container.innerHTML += `
<div class="subject-card">
<div class="subject-header">
<div class="subject-name">${m.libelle}</div>
<div class="coef-badge">Coef ${m.coef}</div>
</div>
<div class="inputs-container">${inputs}</div>
<div class="subject-average" id="avg-${i}">Moyenne: --</div>
</div>`;
        });
      }

      function updateSubject(i) {
        const m = matieres[i];
        let ds = 0,
          test = 0,
          exam = 0,
          tp = 0,
          oral = 0;

        if (m.regime === 1) {
          ds = parseFloat(document.getElementById(`ds-${i}`).value);
          test = parseFloat(document.getElementById(`test-${i}`).value);
          exam = parseFloat(document.getElementById(`exam-${i}`).value);
          if ([ds, test, exam].some((v) => isNaN(v))) return;
        }

        if (m.regime === 2) {
          ds = parseFloat(document.getElementById(`ds-${i}`).value);
          tp = parseFloat(document.getElementById(`tp-${i}`).value);
          exam = parseFloat(document.getElementById(`exam-${i}`).value);
          if ([ds, tp, exam].some((v) => isNaN(v))) return;
        }

        if (m.regime === 3) {
          exam = parseFloat(document.getElementById(`exam-${i}`).value);
          oral = parseFloat(document.getElementById(`oral-${i}`).value);
          if ([exam, oral].some((v) => isNaN(v))) return;
        }

        const avg = calculateSubjectAverage(ds, test, exam, oral, tp, m.regime);
        document.getElementById(
          `avg-${i}`
        ).textContent = `Moyenne: ${avg.toFixed(2)}`;
      }

      function calculateAverage() {
        let sommeNotes = 0;
        let sommeCoef = 0;
        let valid = true;

        matieres.forEach((m, i) => {
          const avgText = document.getElementById(`avg-${i}`).textContent;
          if (!avgText.includes(":")) valid = false;
          const avg = parseFloat(avgText.split(":")[1]);
          if (isNaN(avg)) valid = false;
          sommeNotes += avg * m.coef;
          sommeCoef += m.coef;
        });

        if (!valid) {
          document.getElementById("error-message").classList.add("show");
          return;
        }

        const moyenne = sommeNotes / sommeCoef;
        document.getElementById("average-value").textContent =
          moyenne.toFixed(2);

        const status = document.getElementById("status");
        status.textContent = moyenne >= 10 ? "Admis" : "Redouble";
        status.className = "status " + (moyenne >= 10 ? "admis" : "Redouble");

        document.getElementById("result").classList.add("show");
      }

      initializeSubjects();
    </script>
  </body>
</html>
